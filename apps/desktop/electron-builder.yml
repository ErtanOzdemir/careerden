appId: com.careerden.desktop
productName: Careerden
executableName: Careerden
artifactName: Careerden-${version}-${arch}.${ext}
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
directories:
  buildResources: build
  output: release
icon: build/icon
electronUpdaterCompatibility: ">=2.16"
publish:
  provider: github
files:
  - dist/**/*
  - renderer/**/*
  - node_modules/**/*
  # msgpackr's native extractor is optional. Exclude host-only binaries so cross-architecture
  # packages consistently use its JavaScript fallback.
  - "!node_modules/@msgpackr-extract/**/*"
  - "!node_modules/msgpackr-extract/**/*"
  - package.json
mac:
  category: public.app-category.business
  darkModeSupport: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  hardenedRuntime: true
  icon: build/careerden.icon
  notarize: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  icon: build/icon.icns
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
