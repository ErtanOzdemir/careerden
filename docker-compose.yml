services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: link2cv
      POSTGRES_USER: link2cv
      POSTGRES_PASSWORD: link2cv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
