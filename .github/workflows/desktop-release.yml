name: Desktop Draft Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64 and arm64
            os: macos-latest
            artifact_name: desktop-macos
            artifact_path: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest-mac.yml
          - name: Windows x64 NSIS
            os: windows-latest
            artifact_name: desktop-windows-x64
            artifact_path: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest.yml
          - name: Linux x64 AppImage
            os: ubuntu-latest
            artifact_name: desktop-linux-x64
            artifact_path: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest-linux.yml
    env:
      DESKTOP_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL }}
      DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      CAREERDEN_REQUIRE_DESKTOP_API_BASE_URL: "true"
      CAREERDEN_REQUIRE_DESKTOP_UPDATE_REPOSITORY: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release version and API configuration
        shell: bash
        run: |
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match desktop version ${package_version}"
            exit 1
          fi
          if [[ -z "${DESKTOP_API_BASE_URL}" ]]; then
            echo "::error::Repository variable DESKTOP_API_BASE_URL is required"
            exit 1
          fi

      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          for variable_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Secret ${variable_name} is required for signed macOS releases"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile

      - name: Build desktop application
        run: pnpm turbo run build --filter=@careerden/desktop

      - name: Verify embedded desktop API configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { normalizeDesktopApiBaseUrl } from "./apps/desktop/dist/main/desktop-runtime-config.js";

          const config = JSON.parse(
            await readFile("./apps/desktop/dist/main/desktop-runtime-config.json", "utf8"),
          );
          const expectedApiBaseUrl = normalizeDesktopApiBaseUrl(process.env.DESKTOP_API_BASE_URL);
          const expectedUpdateRepository = process.env.DESKTOP_UPDATE_REPOSITORY;

          if (config.apiBaseUrl !== expectedApiBaseUrl) {
            throw new Error(
              `Embedded API URL ${JSON.stringify(config.apiBaseUrl)} does not match ${JSON.stringify(expectedApiBaseUrl)}`,
            );
          }
          if (config.desktopUpdateRepository !== expectedUpdateRepository) {
            throw new Error(
              `Embedded update repository ${JSON.stringify(config.desktopUpdateRepository)} does not match ${JSON.stringify(expectedUpdateRepository)}`,
            );
          }
          NODE

      # electron-builder 26.15.3 unlocks its own temporary keychain with CSC_KEY_PASSWORD
      # instead of the keychain password, which current macOS runners reject. Import the
      # certificate into a dedicated keychain here so electron-builder discovers the identity.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          keychain_path="${RUNNER_TEMP}/careerden-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/careerden-signing.p12"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::${keychain_password}"

          printf '%s' "${CSC_LINK}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${CSC_KEY_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "${certificate_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" \
            "${keychain_path}" > /dev/null
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$(echo "${keychain}" | xargs)")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"

          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -q "Developer ID Application"; then
            echo "::error::Imported certificate does not contain a Developer ID Application identity"
            exit 1
          fi
          echo "CAREERDEN_SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Package and notarize macOS
        if: runner.os == 'macOS'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: >-
          pnpm --filter @careerden/desktop exec electron-builder
          --config electron-builder.yml
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
          --publish never
          --mac

      - name: Package Windows
        if: runner.os == 'Windows'
        run: >-
          pnpm --filter @careerden/desktop exec electron-builder
          --config electron-builder.yml
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
          --publish never
          --win

      - name: Package Linux
        if: runner.os == 'Linux'
        run: >-
          pnpm --filter @careerden/desktop exec electron-builder
          --config electron-builder.yml
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
          --publish never
          --linux

      - name: Verify updater metadata
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            macOS)
              metadata_file="apps/desktop/release/latest-mac.yml"
              package_version="$(node -p "require('./apps/desktop/package.json').version")"
              node --input-type=module - "${package_version}" <<'NODE'
              import { readFile, stat } from "node:fs/promises";

              const version = process.argv[2];
              const releaseDirectory = "apps/desktop/release";
              const metadataFile = `${releaseDirectory}/latest-mac.yml`;
              const metadata = await readFile(metadataFile, "utf8");

              for (const architecture of ["x64", "arm64"]) {
                const artifactBase = `Careerden-${version}-${architecture}`;
                for (const extension of ["dmg", "zip", "dmg.blockmap", "zip.blockmap"]) {
                  const artifactPath = `${releaseDirectory}/${artifactBase}.${extension}`;
                  if ((await stat(artifactPath)).size === 0) {
                    throw new Error(`Empty macOS release artifact ${artifactPath}`);
                  }
                }

                if (!metadata.includes(`url: ${artifactBase}.zip`)) {
                  throw new Error(`Updater metadata does not reference ${artifactBase}.zip`);
                }
              }

              if (metadata.includes("-universal.")) {
                throw new Error("Updater metadata unexpectedly references a universal macOS artifact");
              }
          NODE

              if compgen -G "apps/desktop/release/*-universal.*" > /dev/null; then
                echo "::error::Universal macOS artifacts must not be generated"
                exit 1
              fi
              ;;
            Windows) metadata_file="apps/desktop/release/latest.yml" ;;
            Linux) metadata_file="apps/desktop/release/latest-linux.yml" ;;
            *) echo "::error::Unsupported runner ${RUNNER_OS}"; exit 1 ;;
          esac
          test -s "${metadata_file}" || {
            echo "::error::Missing updater metadata ${metadata_file}"
            exit 1
          }

      - name: Upload installer and updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.CAREERDEN_SIGNING_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "${CAREERDEN_SIGNING_KEYCHAIN}" || true

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installers and updater metadata
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Validate and prepare update policy
        run: node apps/desktop/scripts/prepare-release-policy.mjs release-assets/careerden-desktop-update-policy.json

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Create or update draft GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_draft}" == "false" ]]; then
            echo "::error::Release ${GITHUB_REF_NAME} is already published"
            exit 1
          fi
          if [[ "${existing_draft}" == "true" ]]; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --draft \
              --generate-notes \
              --title "Careerden ${GITHUB_REF_NAME#v}" \
              --verify-tag
          fi
