name: Desktop Draft Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Careerden Unplugged migrates the user's own database on every update, so each released
  # version needs an upgrade fixture that `pnpm test` migrates. A missing one only warns: the
  # fixture is generated from this tag and lands in a follow-up pull request.
  upgrade-fixture:
    name: Check database upgrade fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warn when this version has no upgrade fixture
        shell: bash
        run: |
          fixture="apps/api/test/fixtures/pglite/${GITHUB_REF_NAME}/fixture.json"
          if [[ ! -f "${fixture}" ]]; then
            echo "::warning title=Missing database upgrade fixture::No ${fixture}. Run 'pnpm --filter @careerden/api-app fixture:pglite --ref ${GITHUB_REF_NAME}' and commit the result so later migrations are tested against ${GITHUB_REF_NAME} databases."
          fi

  # The editions every release contains come from apps/desktop/release-editions.json, which the
  # build matrix and the release verification both read. cloud is Careerden; local is Careerden
  # Unplugged, whose data stays on the device. Only Unplugged is released for now.
  #
  # TODO: the cloud edition is deferred, not dropped. When it ships, add `cloud` to that file.
  # Nothing else needs to change: every step below already handles both editions and gives them
  # distinct artifact names and updater channels (latest*.yml and local*.yml) inside one
  # release, and the verification then requires all six metadata files.
  plan:
    name: Read released editions
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.editions.outputs.editions }}
      title: ${{ steps.editions.outputs.title }}
    steps:
      - uses: actions/checkout@v4

      - id: editions
        name: Read release-editions.json
        shell: bash
        run: |
          node --input-type=module >> "${GITHUB_OUTPUT}" <<'NODE'
          import { readFile } from "node:fs/promises";
          import { parseReleaseEditions } from "./apps/desktop/scripts/desktop-release-verification.mjs";

          const editions = parseReleaseEditions(
            JSON.parse(await readFile("./apps/desktop/release-editions.json", "utf8")),
          );
          console.log(`editions=${JSON.stringify(editions)}`);
          // A release of Unplugged alone is titled after it; with both editions it is Careerden's.
          console.log(`title=${editions.includes("cloud") ? "Careerden" : "Careerden Unplugged"}`);
          NODE

  build:
    name: Build ${{ matrix.edition }} ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.plan.outputs.editions) }}
        platform: [macos, windows-x64, linux-x64]
        include:
          - platform: macos
            name: macOS x64 and arm64
            os: macos-latest
          - platform: windows-x64
            name: Windows x64 NSIS
            os: windows-latest
          - platform: linux-x64
            name: Linux x64 AppImage
            os: ubuntu-latest
    env:
      CAREERDEN_EDITION: ${{ matrix.edition }}
      VITE_CAREERDEN_EDITION: ${{ matrix.edition }}
      # The local edition talks to no Careerden server, so its build must not embed an API URL.
      DESKTOP_API_BASE_URL: ${{ matrix.edition == 'cloud' && vars.DESKTOP_API_BASE_URL || '' }}
      DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      CAREERDEN_REQUIRE_DESKTOP_API_BASE_URL: ${{ matrix.edition == 'cloud' && 'true' || 'false' }}
      CAREERDEN_REQUIRE_DESKTOP_UPDATE_REPOSITORY: "true"
      BUILDER_CONFIG: ${{ matrix.edition == 'local' && 'electron-builder.local.yml' || 'electron-builder.yml' }}
      RELEASE_DIR: ${{ matrix.edition == 'local' && 'release-local' || 'release' }}
      ARTIFACT_PREFIX: ${{ matrix.edition == 'local' && 'CareerdenUnplugged' || 'Careerden' }}
      UPDATE_CHANNEL: ${{ matrix.edition == 'local' && 'local' || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release version and API configuration
        shell: bash
        run: |
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match desktop version ${package_version}"
            exit 1
          fi
          if [[ "${CAREERDEN_EDITION}" == "cloud" && -z "${DESKTOP_API_BASE_URL}" ]]; then
            echo "::error::Repository variable DESKTOP_API_BASE_URL is required"
            exit 1
          fi

      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          for variable_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Secret ${variable_name} is required for signed macOS releases"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile

      - name: Build desktop application
        run: pnpm turbo run build --filter=@careerden/desktop

      - name: Verify embedded desktop API configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { normalizeDesktopApiBaseUrl } from "./apps/desktop/dist/main/desktop-runtime-config.js";

          const config = JSON.parse(
            await readFile("./apps/desktop/dist/main/desktop-runtime-config.json", "utf8"),
          );
          const edition = process.env.CAREERDEN_EDITION;
          const expectedUpdateRepository = process.env.DESKTOP_UPDATE_REPOSITORY;

          if (config.edition !== edition) {
            throw new Error(
              `Embedded edition ${JSON.stringify(config.edition)} does not match ${JSON.stringify(edition)}`,
            );
          }
          if (edition === "local") {
            if ("apiBaseUrl" in config) {
              throw new Error("The local edition must not embed an API URL");
            }
          } else {
            const expectedApiBaseUrl = normalizeDesktopApiBaseUrl(process.env.DESKTOP_API_BASE_URL);
            if (config.apiBaseUrl !== expectedApiBaseUrl) {
              throw new Error(
                `Embedded API URL ${JSON.stringify(config.apiBaseUrl)} does not match ${JSON.stringify(expectedApiBaseUrl)}`,
              );
            }
          }
          if (config.desktopUpdateRepository !== expectedUpdateRepository) {
            throw new Error(
              `Embedded update repository ${JSON.stringify(config.desktopUpdateRepository)} does not match ${JSON.stringify(expectedUpdateRepository)}`,
            );
          }
          NODE

      # electron-builder 26.15.3 unlocks its own temporary keychain with CSC_KEY_PASSWORD
      # instead of the keychain password, which current macOS runners reject. Import the
      # certificate into a dedicated keychain here so electron-builder discovers the identity.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          keychain_path="${RUNNER_TEMP}/careerden-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/careerden-signing.p12"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::${keychain_password}"

          printf '%s' "${CSC_LINK}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" -P "${CSC_KEY_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "${certificate_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" \
            "${keychain_path}" > /dev/null
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$(echo "${keychain}" | xargs)")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"

          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -q "Developer ID Application"; then
            echo "::error::Imported certificate does not contain a Developer ID Application identity"
            exit 1
          fi
          echo "CAREERDEN_SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Package and notarize macOS
        if: runner.os == 'macOS'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: >-
          pnpm --filter @careerden/desktop exec electron-builder
          --config ${{ env.BUILDER_CONFIG }}
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
          --publish never
          --mac

      - name: Package Windows
        if: runner.os == 'Windows'
        run: >-
          pnpm --filter @careerden/desktop exec electron-builder
          --config ${{ env.BUILDER_CONFIG }}
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
          --publish never
          --win

      - name: Package Linux
        if: runner.os == 'Linux'
        run: >-
          pnpm --filter @careerden/desktop exec electron-builder
          --config ${{ env.BUILDER_CONFIG }}
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
          --publish never
          --linux

      - name: Verify updater metadata
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            macOS)
              metadata_file="apps/desktop/${RELEASE_DIR}/${UPDATE_CHANNEL}-mac.yml"
              package_version="$(node -p "require('./apps/desktop/package.json').version")"
              node --input-type=module - "${package_version}" <<'NODE'
              import { readFile, stat } from "node:fs/promises";

              const version = process.argv[2];
              const releaseDirectory = `apps/desktop/${process.env.RELEASE_DIR}`;
              const metadataFile = `${releaseDirectory}/${process.env.UPDATE_CHANNEL}-mac.yml`;
              const metadata = await readFile(metadataFile, "utf8");

              for (const architecture of ["x64", "arm64"]) {
                const artifactBase = `${process.env.ARTIFACT_PREFIX}-${version}-${architecture}`;
                for (const extension of ["dmg", "zip", "dmg.blockmap", "zip.blockmap"]) {
                  const artifactPath = `${releaseDirectory}/${artifactBase}.${extension}`;
                  if ((await stat(artifactPath)).size === 0) {
                    throw new Error(`Empty macOS release artifact ${artifactPath}`);
                  }
                }

                if (!metadata.includes(`url: ${artifactBase}.zip`)) {
                  throw new Error(`Updater metadata does not reference ${artifactBase}.zip`);
                }
              }

              if (metadata.includes("-universal.")) {
                throw new Error("Updater metadata unexpectedly references a universal macOS artifact");
              }
          NODE

              if compgen -G "apps/desktop/${RELEASE_DIR}/*-universal.*" > /dev/null; then
                echo "::error::Universal macOS artifacts must not be generated"
                exit 1
              fi
              ;;
            Windows) metadata_file="apps/desktop/${RELEASE_DIR}/${UPDATE_CHANNEL}.yml" ;;
            Linux) metadata_file="apps/desktop/${RELEASE_DIR}/${UPDATE_CHANNEL}-linux.yml" ;;
            *) echo "::error::Unsupported runner ${RUNNER_OS}"; exit 1 ;;
          esac
          test -s "${metadata_file}" || {
            echo "::error::Missing updater metadata ${metadata_file}"
            exit 1
          }

      - name: Upload installer and updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.edition }}-${{ matrix.platform }}
          path: |
            apps/desktop/${{ env.RELEASE_DIR }}/*.dmg
            apps/desktop/${{ env.RELEASE_DIR }}/*.zip
            apps/desktop/${{ env.RELEASE_DIR }}/*.exe
            apps/desktop/${{ env.RELEASE_DIR }}/*.AppImage
            apps/desktop/${{ env.RELEASE_DIR }}/*.blockmap
            apps/desktop/${{ env.RELEASE_DIR }}/${{ env.UPDATE_CHANNEL }}*.yml
          if-no-files-found: error
          retention-days: 1

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS' && env.CAREERDEN_SIGNING_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "${CAREERDEN_SIGNING_KEYCHAIN}" || true

  release:
    name: Create draft release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installers and updater metadata
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and prepare update policy
        run: node apps/desktop/scripts/prepare-release-policy.mjs release-assets/careerden-desktop-update-policy.json

      # Each build job checked only its own metadata. An installed app reads only its own
      # edition's and platform's file and treats a missing one as "no update", so check the
      # release as a whole before it exists: every edition's three metadata files at this tag's
      # version, every file they reference present with a matching sha512, and a valid policy.
      - name: Verify release completeness
        run: node apps/desktop/scripts/verify-desktop-release.mjs "${GITHUB_REF_NAME}" --dir release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Create or update draft GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ needs.plan.outputs.title }}
        run: |
          existing_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_draft}" == "false" ]]; then
            echo "::error::Release ${GITHUB_REF_NAME} is already published"
            exit 1
          fi
          if [[ "${existing_draft}" == "true" ]]; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --draft \
              --generate-notes \
              --title "${RELEASE_TITLE} ${GITHUB_REF_NAME#v}" \
              --verify-tag
          fi
