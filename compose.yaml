name: careerden

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careerden
      POSTGRES_PASSWORD: careerden
      POSTGRES_DB: careerden
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bullstudio:
    image: emirce/bullstudio:2.2.0
    restart: unless-stopped
    profiles: ["operations"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 4000
      BULLSTUDIO_USERNAME: bullstudio
      BULLSTUDIO_PASSWORD: Careerden-Bullstudio-2026!
      BULLSTUDIO_POLL_INTERVAL: ${BULLSTUDIO_POLL_INTERVAL:-5000}
      BULLSTUDIO_POLL_ALLOW_OVERRIDE: "false"
    ports:
      - "127.0.0.1:${BULLSTUDIO_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/app/logs
  opencode:
    # Free-tier AI for users without a subscription. Stateless: no volume, and the API deletes
    # every session after its request.
    image: ghcr.io/anomalyco/opencode:2.0.30
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /workspace
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-dev-only-careerden-opencode-password}
    volumes:
      - ./docker/opencode/opencode.json:/workspace/opencode.json:ro
    ports:
      - "127.0.0.1:4096:4096"

  openobserve:
    image: openobserve/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@yopmail.com
      - ZO_ROOT_USER_PASSWORD=StrongPassword123.
      - ZO_DATA_DIR=/data
      - ZO_COMPACT_DATA_RETENTION_DAYS=14
      - ZO_COMPACT_INTERVAL=600
    volumes:
      - openobserve_data:/data

volumes:
  openobserve_data:
  postgres-data:
  redis-data:
  rustfs-data:
  rustfs-logs:
