<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{full_name}} - CV</title>
    <style>
      body {
        color: #1f2937;
        font-family: Arial, sans-serif;
        line-height: 1.5;
        margin: 40px;
      }
      h1,
      h2 {
        color: #111827;
        margin-bottom: 8px;
      }
      section {
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <h1>{{full_name}}</h1>
    <p>{{headline}}</p>
    <p>{{email}} {{location}}</p>

    <section>
      <h2>Personalized Summary</h2>
      <div>{{customized_summary}}</div>
    </section>

    <section>
      <h2>Strong Skills</h2>
      <ul>
        {{strong_skills}}
      </ul>
    </section>

    <section>
      <h2>Recommended Achievements</h2>
      <ul>
        {{recommended_achievements}}
      </ul>
    </section>

    <section>
      <h2>Experience</h2>
      <ul>
        {{experience_list}}
      </ul>
    </section>

    <section>
      <h2>Skills</h2>
      <ul>
        {{skills}}
      </ul>
    </section>
  </body>
</html>
