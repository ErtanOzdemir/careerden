services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: link2cv
      POSTGRES_PASSWORD: link2cv
      POSTGRES_DB: link2cv
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/app/logs
  openobserve:
    image: openobserve/openobserve:latest
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@yopmail.com
      - ZO_ROOT_USER_PASSWORD=StrongPassword123.
      - ZO_DATA_DIR=/data
      - ZO_COMPACT_DATA_RETENTION_DAYS=14
      - ZO_COMPACT_INTERVAL=600
    volumes:
      - openobserve_data:/data

volumes:
  openobserve_data:
  postgres-data:
  redis-data:
  rustfs-data:
  rustfs-logs:
